- name: Installer Jenkins
  hosts: ci_servers
  become: true

  tasks:
    - name: Installer les prérequis
      ansible.builtin.apt:
        name: [fontconfig, ca-certificates]
        update_cache: true
        cache_valid_time: 3600

    - name: Créer le dossier des clés apt
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Ajouter la clé du dépôt Temurin (Java 21)
      ansible.builtin.get_url:
        url: https://packages.adoptium.net/artifactory/api/gpg/key/public
        dest: /etc/apt/keyrings/adoptium.asc
        mode: "0644"

    - name: Ajouter le dépôt Temurin
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/adoptium.asc] https://packages.adoptium.net/artifactory/deb {{ ansible_distribution_release }} main"
        filename: adoptium
        state: present

    - name: Installer Java 21
      ansible.builtin.apt:
        name: temurin-21-jre

    - name: Ajouter la clé du dépôt Jenkins
      ansible.builtin.get_url:
        url: https://pkg.jenkins.io/debian-stable/jenkins.io-2026.key
        dest: /etc/apt/keyrings/jenkins-keyring.asc
        mode: "0644"

    - name: Ajouter le dépôt Jenkins (LTS)
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/jenkins-keyring.asc] https://pkg.jenkins.io/debian-stable binary/"
        filename: jenkins
        state: present

    - name: Installer Jenkins
      ansible.builtin.apt:
        name: jenkins

    - name: Activer et démarrer Jenkins
      ansible.builtin.systemd:
        name: jenkins
        enabled: true
        state: started

    - name: Attendre que Jenkins réponde sur le port 8080
      ansible.builtin.wait_for:
        port: 8080
        timeout: 300

    - name: Lire le mot de passe administrateur initial
      ansible.builtin.slurp:
        src: /var/lib/jenkins/secrets/initialAdminPassword
      register: jenkins_pwd
      until: jenkins_pwd is succeeded
      retries: 10
      delay: 5

    - name: Afficher le mot de passe initial
      ansible.builtin.debug:
        msg: "{{ jenkins_pwd.content | b64decode | trim }}"

    - name: Installer les outils pour les jobs CI
      ansible.builtin.apt:
        name: [git, python3-venv, python3-pip]

    - name: Installer uv et pip-audit dans un venv dédié
      ansible.builtin.pip:
        name: [uv, pip-audit]
        virtualenv: /opt/uv
        virtualenv_command: python3 -m venv

    - name: Installer Python 3.12 avec uv (dossier partagé)
      ansible.builtin.command:
        cmd: /opt/uv/bin/uv python install 3.12
        creates: "/opt/uv-python/cpython-3.12*"
      environment:
        UV_PYTHON_INSTALL_DIR: /opt/uv-python

    - name: Installer Ansible (pour les jobs de déploiement)
      ansible.builtin.apt:
        name: ansible-core
